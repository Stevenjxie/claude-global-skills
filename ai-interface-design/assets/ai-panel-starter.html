<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Panel Starter</title>
  <style>
    :root {
      --ink: #17201d;
      --muted: #66706c;
      --canvas: #f7f6f2;
      --surface: #fffefa;
      --soft: #eeece6;
      --line: #deddd7;
      --accent: #176b51;
      --accent-soft: #e5f0eb;
      --warn: #9a5423;
      --shadow: 0 16px 42px rgb(32 41 37 / 8%);
      --serif: "Iowan Old Style", "Palatino Linotype", "Songti SC", serif;
      --sans: "Aptos", "Segoe UI", "PingFang SC", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; overflow-x: hidden; color: var(--ink); font-family: var(--sans); background: var(--canvas); }
    button, textarea { font: inherit; }
    .app { display: grid; min-height: 100vh; grid-template-rows: auto 1fr auto; }
    header {
      display: flex; min-height: 64px; padding: 10px 18px; align-items: center;
      justify-content: space-between; background: rgb(255 254 250 / 92%);
      border-bottom: 1px solid rgb(23 32 29 / 8%); backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo { display: grid; width: 38px; height: 38px; place-items: center; color: white; background: var(--accent); border-radius: 10px; }
    .brand strong { display: block; font-size: 14px; }
    .brand small { color: var(--muted); font-size: 10px; }
    .context { padding: 7px 10px; color: var(--muted); font-size: 11px; background: var(--soft); border: 0; border-radius: 8px; }
    main { width: min(100% - 28px, 820px); min-width: 0; margin: 0 auto; padding: 34px 0 130px; }
    .hero { text-align: center; }
    .eyebrow { display: inline-block; padding: 5px 8px; color: var(--accent); font-size: 9px; font-weight: 700; letter-spacing: .12em; background: var(--accent-soft); border-radius: 99px; }
    h1 { margin: 14px 0 5px; font: 500 clamp(28px, 6vw, 38px)/1.1 var(--serif); }
    .hero p { margin: 0; color: var(--muted); font-size: 13px; }
    .starters { display: grid; margin-top: 26px; grid-template-columns: 1fr 1fr; gap: 9px; }
    .starter { padding: 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
    .starter:hover { border-color: var(--accent); background: var(--accent-soft); }
    .starter b { display: block; font-size: 12px; }
    .starter span { color: var(--muted); font-size: 11px; }
    .conversation { margin-top: 30px; padding-top: 24px; border-top: 1px solid var(--line); }
    .user { width: fit-content; max-width: 75%; margin-left: auto; padding: 10px 13px; overflow-wrap: anywhere; background: var(--soft); border-radius: 15px 15px 4px 15px; }
    .ai { display: grid; margin-top: 14px; grid-template-columns: 30px 1fr; gap: 10px; }
    .avatar { display: grid; width: 30px; height: 30px; place-items: center; color: white; background: var(--accent); border-radius: 8px; }
    .answer { min-width: 0; padding: 16px; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 4px 12px 12px 12px; box-shadow: var(--shadow); }
    .answer small { color: var(--accent); font-weight: 650; }
    .answer h2 { margin: 7px 0; font: 600 18px/1.3 var(--serif); }
    .answer p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .evidence { display: grid; margin-top: 12px; grid-template-columns: repeat(3, 1fr); gap: 7px; }
    .evidence div { padding: 10px; background: var(--canvas); border: 1px solid var(--line); border-radius: 8px; }
    .evidence span { display: block; color: var(--muted); font-size: 10px; }
    .evidence strong { display: block; margin-top: 4px; color: var(--accent); font: 600 17px/1 var(--serif); }
    .sources { display: flex; margin-top: 12px; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; }
    .sources button { padding: 4px 7px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 6px; }
    footer { position: fixed; right: 0; bottom: 0; left: 0; padding: 12px max(14px, calc((100% - 820px) / 2)); background: linear-gradient(transparent, var(--surface) 28%); }
    .composer { display: flex; padding: 7px; align-items: end; gap: 7px; background: var(--surface); border: 1px solid var(--line); border-radius: 15px; box-shadow: var(--shadow); }
    textarea { width: 100%; min-height: 34px; padding: 8px 5px 4px; resize: none; background: transparent; border: 0; outline: 0; }
    .send { width: 34px; height: 34px; flex: 0 0 auto; color: white; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer; }
    footer p { margin: 5px 0 0; color: var(--muted); font-size: 9px; text-align: center; }
    @media (max-width: 600px) {
      .brand small { display: none; }
      .brand { min-width: 0; }
      .context { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .starters, .evidence { grid-template-columns: 1fr; }
      .starter:nth-child(n+4) { display: none; }
      main { padding-top: 24px; }
      .user { width: auto; max-width: 86%; margin-left: 14%; }
      .ai { grid-template-columns: 30px minmax(0, 1fr); }
    }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand"><span class="logo">AI</span><div><strong>项目智能助手</strong><small>解释、分析与建议</small></div></div>
      <button class="context">项目 A · 本月 ⌄</button>
    </header>
    <main>
      <section class="hero">
        <span class="eyebrow">CONTEXT-AWARE COPILOT</span>
        <h1>今天想解决什么？</h1>
        <p>选择一个典型任务，或直接描述你的目标和背景。</p>
      </section>
      <section class="starters">
        <button class="starter"><b>解释</b><span>帮我理解这个流程的关键节点</span></button>
        <button class="starter"><b>分析</b><span>总结本月最值得关注的变化</span></button>
        <button class="starter"><b>建议</b><span>给我三个按影响排序的行动建议</span></button>
        <button class="starter"><b>创建</b><span>根据当前上下文生成一份草案</span></button>
      </section>
      <section class="conversation">
        <div class="user">总结本月最值得关注的变化。</div>
        <div class="ai">
          <span class="avatar">A</span>
          <div class="answer">
            <small>分析完成 · 3 个数据维度</small>
            <h2>核心指标改善，但需要关注成本上升</h2>
            <p>总量较上期提升，主要由高价值客户贡献；同期成本增速更快，建议先复核贡献最大的两个成本项。</p>
            <div class="evidence">
              <div><span>总量</span><strong>+8.6%</strong></div>
              <div><span>成本</span><strong>+11.2%</strong></div>
              <div><span>完整度</span><strong>96%</strong></div>
            </div>
            <div class="sources"><span>来源</span><button>业务数据</button><button>分析口径</button></div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <div class="composer"><textarea rows="1" placeholder="输入问题，并补充目标或限制…"></textarea><button class="send" aria-label="发送">↑</button></div>
      <p>AI 回答可能有误，关键结论请结合来源复核</p>
    </footer>
  </div>
</body>
</html>
